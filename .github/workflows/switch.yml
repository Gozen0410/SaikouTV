name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Borealis
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/

      - name: Patch Borealis for current libnx
        working-directory: switch/borealis
        run: |
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp

      - name: Instrument Borealis init safely
        working-directory: switch/borealis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          app = 'library/lib/core/application.cpp'
          replace_once(app,
              'namespace brls\\n{\\n\\nbool Application::init()\\n{',
              '''namespace brls
          {
          
          static void applicationInitDebug(const char* message)
          {
              FILE* log = std::fopen("sdmc:/switch/saikou_debug.log", "a");
              if (!log)
                  return;
              std::fprintf(log, "[Borealis/Application] %s\\n", message);
              std::fflush(log);
              std::fclose(log);
          }
          
          bool Application::init()
          {\n    applicationInitDebug("Application::init START");''')
          replace_once(app,
              'Application::platform = Platform::createPlatform();',
              'Application::platform = Platform::createPlatform();\\n    applicationInitDebug("creating platform RETURNED");')
          replace_once(app,
              '    // Init i18n\\n    loadTranslations();',
              '    applicationInitDebug("loadTranslations START");\\n    loadTranslations();\\n    applicationInitDebug("loadTranslations RETURNED");')
          replace_once(app,
              '    Application::inited = true;\\n    return true;',
              '    applicationInitDebug("Application::init END");\\n    Application::inited = true;\\n    return true;')

          platform = 'library/lib/core/platform.cpp'
          replace_once(platform,
              '#include <borealis/core/platform.hpp>',
              '''#include <borealis/core/platform.hpp>
          #include <cstdio>''')
          replace_once(platform,
              'namespace brls\\n{\\n\\nPlatform* Platform::createPlatform()',
              '''namespace brls
          {
          
          static void platformInitDebug(const char* message)
          {
              FILE* log = std::fopen("sdmc:/switch/saikou_debug.log", "a");
              if (!log)
                  return;
              std::fprintf(log, "[Borealis/Platform] %s\\n", message);
              std::fflush(log);
              std::fclose(log);
          }
          
          Platform* Platform::createPlatform()''')
          replace_once(platform,
              '#if defined(__SWITCH__)\\n    return new SwitchPlatform();',
              '#if defined(__SWITCH__)\\n    platformInitDebug("Switch createPlatform START");\\n    SwitchPlatform* platform = new SwitchPlatform();\\n    platformInitDebug("SwitchPlatform constructed");\\n    return platform;')
          PY

      - name: Verify Borealis diagnostic source
        working-directory: switch/borealis
        run: |
          echo "=== DIAGNOSTIC BOREALIS BUILD ==="
          echo "Borealis revision: $(git rev-parse HEAD)"
          grep -n "Application::init START\|creating platform RETURNED\|loadTranslations START\|Application::init END" library/lib/core/application.cpp
          grep -n "Switch createPlatform START\|SwitchPlatform constructed" library/lib/core/platform.cpp
          grep -n "SwitchPlatform constructor START\|SwitchPlatform constructor END" library/lib/platforms/switch/switch_platform.cpp

      - name: Build NRO
        working-directory: switch
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/*.nro
