name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Borealis
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/

      - name: Patch Borealis for current libnx
        working-directory: switch/borealis
        run: |
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp

      - name: Instrument i18n diagnostics
        working-directory: switch/borealis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/core/i18n.cpp')
          s = p.read_text()
          marker = 'static void loadLocale(std::string locale, nlohmann::json* target)\n{'
          if marker not in s:
              raise SystemExit('loadLocale marker not found')
          replacement = '''static void loadLocale(std::string locale, nlohmann::json* target)
          {
              std::string debugPath = BRLS_ASSET("i18n/" + locale);
              FILE* debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");
              if (debugLog)
              {
                  std::fprintf(debugLog, "[Borealis/i18n] locale=%s path=%s exists=%d directory=%d\\n",
                      locale.c_str(), debugPath.c_str(),
                      std::filesystem::exists(debugPath) ? 1 : 0,
                      std::filesystem::is_directory(debugPath) ? 1 : 0);
                  std::fflush(debugLog);
                  std::fclose(debugLog);
              }
          '''
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          header = Path('library/lib/core/i18n.cpp')
          s = header.read_text()
          if '#include <cstdio>' not in s:
              s = s.replace('#include <filesystem>', '#include <filesystem>\n#include <cstdio>', 1)
          header.write_text(s)
          PY

      - name: Verify Borealis diagnostic source
        working-directory: switch/borealis
        run: |
          echo "=== DIAGNOSTIC BOREALIS BUILD ==="
          echo "Borealis revision: $(git rev-parse HEAD)"
          grep -n "locale=%s path=%s exists" library/lib/core/i18n.cpp
          grep -n "SwitchPlatform constructor START\|SwitchPlatform constructor END" library/lib/platforms/switch/switch_platform.cpp

      - name: Build NRO
        working-directory: switch
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/*.nro
