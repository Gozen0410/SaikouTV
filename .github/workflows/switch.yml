name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Borealis
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs
      - name: Patch Borealis
        working-directory: switch/borealis
        run: |
          set -eux
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp
          sed -i 's/    View\* getDefaultFocus();/    virtual View* getDefaultFocus();/' library/include/borealis/core/activity.hpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()
          old = '''        this->activeTab = newContent;\n    });\n}\n'''
          new = '''        this->activeTab = newContent;\n    });\n\n    // Initialize the first tab immediately. Normally the sidebar focus\n    // activates it, but HomeActivity may deliberately focus its content.\n    if (this->activeTab == nullptr)\n    {\n        Box* contentView = (Box*)this->contentView;\n        View* newContent = creator();\n        if (newContent)\n        {\n            newContent->setGrow(1.0f);\n            contentView->addView(newContent);\n            this->activeTab = newContent;\n        }\n    }\n}\n'''
          if old not in s:
              raise SystemExit('TabFrame insertion anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A18 -B4 'Initialize the first tab immediately' library/lib/views/tab_frame.cpp
      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp
      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
