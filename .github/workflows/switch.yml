name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs
      - name: Patch Borealis
        working-directory: switch/borealis
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          p = Path('library/lib/platforms/switch/swkbd.cpp')
          lines = p.read_text().splitlines()
          needle = 'swkbdConfigSetStringLenMaxExt(&config, 1);'
          p.write_text('\n'.join(line for line in lines if needle not in line) + '\n')

          p = Path('library/include/borealis/core/activity.hpp')
          s = p.read_text()
          old = '    View* getDefaultFocus();'
          new = '    virtual View* getDefaultFocus();'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one Activity focus declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # Keep the proven TabFrame addTab lifecycle untouched. The original
          # XML callback captured a tinyxml2 element owned by the parse document;
          # that pointer is not safe to use after XML inflation completes.
          # Capture a serialized copy of each tab child instead, then create the
          # real view from that independent XML string after pushActivity returns.
          p = Path('library/include/borealis/views/tab_frame.hpp')
          s = p.read_text()
          old = '    void addTab(std::string label, TabViewCreator creator);\n    void addSeparator();'
          new = '    void addTab(std::string label, TabViewCreator creator);\n    void addSeparator();\n\n    void initializeFirstTab();'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one TabFrame declaration anchor, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '    View* activeTab = nullptr;'
          new = '    View* activeTab = nullptr;\n    TabViewCreator firstTabCreator = nullptr;'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one activeTab declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()
          include_anchor = '#include <borealis/views/tab_frame.hpp>\n'
          if s.count(include_anchor) != 1:
              raise SystemExit('expected exactly one tab_frame include anchor')
          s = s.replace(include_anchor, include_anchor + '#include <tinyxml2.h>\n', 1)

          old = '''        if (viewElement)\n        {\n            this->addTab(label, [viewElement] {\n                return View::createFromXMLElement(viewElement);\n            });\n\n            if (viewElement->NextSiblingElement())\n                fatal("\\\"brls:Tab\\\" can only contain one child element");\n        }'''
          new = '''        if (viewElement)\n        {\n            tinyxml2::XMLPrinter printer;\n            viewElement->Accept(&printer);\n            std::string viewXML = printer.CStr();\n\n            TabViewCreator creator = [viewXML] {\n                return View::createFromXMLString(viewXML);\n            };\n\n            if (!this->firstTabCreator)\n                this->firstTabCreator = creator;\n\n            this->addTab(label, creator);\n\n            if (viewElement->NextSiblingElement())\n                fatal("\\\"brls:Tab\\\" can only contain one child element");\n        }'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one XML tab creator block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          anchor = 'void TabFrame::addSeparator()\n{'
          method = '''void TabFrame::initializeFirstTab()\n{\n    if (this->activeTab || !this->firstTabCreator)\n        return;\n\n    View* initialContent = this->firstTabCreator();\n    if (!initialContent)\n        return;\n\n    Box* contentView = (Box*)this->contentView;\n    initialContent->setGrow(1.0f);\n    contentView->addView(initialContent);\n    this->activeTab = initialContent;\n}\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one addSeparator anchor, found {s.count(anchor)}')
          s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)
          PY

          grep -n -A24 'void TabFrame::initializeFirstTab' library/lib/views/tab_frame.cpp
          grep -n -A35 'if (viewElement)' library/lib/views/tab_frame.cpp
          test "$(grep -c 'TabViewCreator creator = \[viewXML\]' library/lib/views/tab_frame.cpp)" -eq 1
          test "$(grep -c 'View::createFromXMLString(viewXML)' library/lib/views/tab_frame.cpp)" -eq 1
          ! grep -R -n 'firstTabElement\|\[viewElement\]' library/include/borealis/views/tab_frame.hpp library/lib/views/tab_frame.cpp
          git diff --check
      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp
      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
