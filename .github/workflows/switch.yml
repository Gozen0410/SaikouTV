name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch known-good Borealis with diagnostics
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/

      - name: Patch Borealis for current libnx
        working-directory: switch/borealis
        run: |
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp

      - name: Verify ROMFS payload
        working-directory: switch
        run: |
          echo "=== ROMFS PAYLOAD ==="
          find romfs -type f -print | sort
          test -d romfs/i18n/en-US
          test -f romfs/i18n/en-US/brls.json
          echo "i18n payload present"

      - name: Verify configuration
        working-directory: switch
        run: |
          grep -q '^ROMFS := romfs$' Makefile
          grep -q 'ROMFS_DEPS' Makefile
          grep -q 'SwitchPlatform constructor START' borealis/library/lib/platforms/switch/switch_platform.cpp
          grep -q 'SwitchPlatform constructor END' borealis/library/lib/platforms/switch/switch_platform.cpp
          echo "DEVKITPRO=${DEVKITPRO}"
          grep -nE 'NROFLAGS|ROMFS|elf2nro' Makefile "${DEVKITPRO}/libnx/switch_rules" || true

      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp

      - name: Package NRO with ROMFS explicitly
        working-directory: switch
        run: |
          set -eux
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" \
            saikou_switch.elf \
            saikou_switch.nro \
            --nacp=saikou_switch.nacp \
            --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          echo "=== NRO PACKAGING ==="
          ls -lh saikou_switch.nro
          echo "ROMFS files packaged from: ${PWD}/romfs"
          find romfs -type f -print | sort

      - name: Inspect build
        working-directory: switch
        run: |
          ls -lh saikou_switch.nro saikou_switch.elf saikou_switch.nacp
          echo "ROMFS files: $(find romfs -type f | wc -l)"

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/*.nro
