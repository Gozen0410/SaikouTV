name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch known-good Borealis with diagnostics
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git diff --binary > /tmp/borealis-base.patch || true
          cd ../..
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/

      - name: Patch Borealis for current libnx
        working-directory: switch/borealis
        run: |
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp

      - name: Add init execution diagnostics
        working-directory: switch/borealis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/core/application.cpp')
          s = p.read_text()
          needle = '''bool Application::init()\n{\n    // Init platform\n'''
          inject = '''bool Application::init()\n{\n    FILE* debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");\n    if (debugLog)\n    {\n        std::fprintf(debugLog, "[Borealis/Application] init ENTER\\n");\n        std::fflush(debugLog);\n        std::fclose(debugLog);\n    }\n\n    // Init platform\n'''
          if needle not in s:\n              raise SystemExit('Application::init entry needle not found')\n          s = s.replace(needle, inject, 1)

          needle = '''    if (!Application::platform)\n    {\n'''
          inject = '''    debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");\n    if (debugLog)\n    {\n        std::fprintf(debugLog, "[Borealis/Application] platform CREATED\\n");\n        std::fflush(debugLog);\n        std::fclose(debugLog);\n    }\n\n    if (!Application::platform)\n    {\n'''
          if needle not in s:\n              raise SystemExit('platform check needle not found')\n          s = s.replace(needle, inject, 1)

          needle = '''    // Init i18n\n    loadTranslations();\n\n    Application::inited = true;\n'''
          inject = '''    debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");\n    if (debugLog)\n    {\n        std::fprintf(debugLog, "[Borealis/Application] BEFORE loadTranslations\\n");\n        std::fflush(debugLog);\n        std::fclose(debugLog);\n    }\n\n    // Init i18n\n    loadTranslations();\n\n    debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");\n    if (debugLog)\n    {\n        std::fprintf(debugLog, "[Borealis/Application] AFTER loadTranslations\\n");\n        std::fflush(debugLog);\n        std::fclose(debugLog);\n    }\n\n    Application::inited = true;\n'''
          if needle not in s:\n              raise SystemExit('loadTranslations needle not found')\n          s = s.replace(needle, inject, 1)
          p.write_text(s)
          PY

      - name: Add i18n diagnostic without rewriting existing functions
        working-directory: switch/borealis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/core/i18n.cpp')
          s = p.read_text()
          if '#include <cstdio>' not in s:
              s = s.replace('#include <string>\n', '#include <string>\n#include <cstdio>\n', 1)
          needle = '    std::string localePath = BRLS_ASSET("i18n/" + locale);\n'
          inject = '''    std::string localePath = BRLS_ASSET("i18n/" + locale);\n\n    FILE* debugLog = std::fopen("sdmc:/switch/saikou_debug.log", "a");\n    if (debugLog)\n    {\n        bool exists = std::filesystem::exists(localePath);\n        bool isDirectory = exists && std::filesystem::is_directory(localePath);\n        std::fprintf(debugLog, "[Borealis/i18n] locale=%s path=%s exists=%d directory=%d\\n",\n            locale.c_str(), localePath.c_str(), exists ? 1 : 0, isDirectory ? 1 : 0);\n        std::fflush(debugLog);\n        std::fclose(debugLog);\n    }\n'''
          if needle not in s:
              raise SystemExit('i18n path needle not found')
          s = s.replace(needle, inject, 1)
          p.write_text(s)
          PY

      - name: Verify full Borealis application implementation and diagnostics
        working-directory: switch/borealis
        run: |
          echo "=== BOREALIS DIAGNOSTIC BUILD ==="
          echo "Borealis revision: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "7ae6c2826be5f9db5140a093c8fb8832ae356919"
          grep -q 'Application::init' library/lib/core/application.cpp
          grep -q 'Application::createWindow' library/lib/core/application.cpp
          grep -q 'Application::mainLoop' library/lib/core/application.cpp
          grep -q 'Application::frame' library/lib/core/application.cpp
          grep -q 'Application::exit' library/lib/core/application.cpp
          grep -q 'Application::setGlobalQuit' library/lib/core/application.cpp
          grep -q 'Application::getLocale' library/lib/core/application.cpp
          grep -q 'init ENTER' library/lib/core/application.cpp
          grep -q 'platform CREATED' library/lib/core/application.cpp
          grep -q 'BEFORE loadTranslations' library/lib/core/application.cpp
          grep -q 'AFTER loadTranslations' library/lib/core/application.cpp
          grep -q 'locale=%s path=%s exists' library/lib/core/i18n.cpp
          grep -q 'SwitchPlatform constructor START' library/lib/platforms/switch/switch_platform.cpp
          grep -q 'SwitchPlatform constructor END' library/lib/platforms/switch/switch_platform.cpp

      - name: Clean build
        working-directory: switch
        run: make clean

      - name: Build NRO
        working-directory: switch
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/*.nro
