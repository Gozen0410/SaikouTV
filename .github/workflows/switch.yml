name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Borealis
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 1bf5fe7de9515c8da1b9ceec8f113879989d08e4
          git checkout 1bf5fe7de9515c8da1b9ceec8f113879989d08e4
          cd ../..
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/

      - name: Patch Borealis for current libnx
        working-directory: switch/borealis
        run: |
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp

      - name: Verify Borealis diagnostic source
        working-directory: switch/borealis
        run: |
          echo "Borealis revision: $(git rev-parse HEAD)"
          grep -n "Application::init START\|creating platform START\|loadTranslations START" library/lib/core/application.cpp
          grep -n "SwitchPlatform constructor START\|creating SwitchAudioPlayer START\|creating SwitchInputManager START\|creating SwitchFontLoader START" library/lib/platforms/switch/switch_platform.cpp

      - name: Build NRO
        working-directory: switch
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/*.nro
