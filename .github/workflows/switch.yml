name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs
      - name: Patch Borealis
        working-directory: switch/borealis
        run: |
          set -eux
          sed -i 's/swkbdConfigSetStringLenMaxExt(&config, 1);//' library/lib/platforms/switch/swkbd.cpp
          sed -i 's/    View\* getDefaultFocus();/    virtual View* getDefaultFocus();/' library/include/borealis/core/activity.hpp

          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()

          anchor = '''        this->activeTab = newContent;\n    });\n}'''
          replacement = '''        this->activeTab = newContent;\n    });\n\n    // Activity focus is deliberately bypassed. Materialize the first tab\n    // immediately while the XML element captured by creator is still valid.\n    if (!this->activeTab)\n    {\n        View* newContent = creator();\n        if (newContent)\n        {\n            newContent->setGrow(1.0f);\n            Box* contentView = (Box*)this->contentView;\n            contentView->addView(newContent);\n            this->activeTab = newContent;\n        }\n    }\n}'''

          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one addTab tail anchor, found {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY

          # Verify the patch is minimal: no new TabFrame API/state and no
          # initializeFirstTab symbol should exist anywhere in the tree.
          ! grep -R -n 'initializeFirstTab' library/include/borealis/views/tab_frame.hpp library/lib/views/tab_frame.cpp
          grep -n -A55 -B5 'void TabFrame::addTab' library/lib/views/tab_frame.cpp
          git diff --check
      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp
      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
