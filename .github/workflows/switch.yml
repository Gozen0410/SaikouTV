name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs
      - name: Patch Borealis
        working-directory: switch/borealis
        run: |
          set -eux
          # Preserve the two pre-existing Switch build compatibility fixes.
          # Remove the unsupported keyboard API call without introducing diff
          # whitespace into the vendor tree.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/lib/platforms/switch/swkbd.cpp')
          lines = p.read_text().splitlines()
          needle = 'swkbdConfigSetStringLenMaxExt(&config, 1);'
          p.write_text('\n'.join(line for line in lines if needle not in line) + '\n')
          
          p = Path('library/include/borealis/core/activity.hpp')
          s = p.read_text()
          old = '    View* getDefaultFocus();'
          new = '    virtual View* getDefaultFocus();'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one Activity focus declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          
          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()
          anchor = '''        this->activeTab = newContent;\n    });\n}'''
          replacement = '''        this->activeTab = newContent;\n    });\n\n    // Materialize the first tab once during TabFrame XML construction. This\n    // leaves the proven Activity nullptr-focus workaround untouched and avoids\n    // entering the Sidebar focus callback just to populate the initial page.\n    if (!this->activeTab)\n    {\n        View* initialContent = creator();\n        if (initialContent)\n        {\n            initialContent->setGrow(1.0f);\n            Box* contentView = (Box*)this->contentView;\n            contentView->addView(initialContent);\n            this->activeTab = initialContent;\n        }\n    }\n}'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one addTab tail anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor, replacement, 1))
          PY

          # Hard verification: only the intended three vendor edits exist.
          test "$(grep -c 'initialContent = creator();' library/lib/views/tab_frame.cpp)" -eq 1
          ! grep -R -n 'initializeFirstTab\|firstTabCreator' library/include/borealis/views/tab_frame.hpp library/lib/views/tab_frame.cpp
          grep -n -A45 -B5 'void TabFrame::addTab' library/lib/views/tab_frame.cpp
          git diff --check
      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp
      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
