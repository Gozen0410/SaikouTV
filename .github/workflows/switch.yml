name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs
      - name: Patch Borealis
        working-directory: switch/borealis
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          p = Path('library/lib/platforms/switch/swkbd.cpp')
          lines = p.read_text().splitlines()
          needle = 'swkbdConfigSetStringLenMaxExt(&config, 1);'
          p.write_text('\n'.join(line for line in lines if needle not in line) + '\n')

          p = Path('library/include/borealis/core/activity.hpp')
          s = p.read_text()
          old = '    View* getDefaultFocus();'
          new = '    virtual View* getDefaultFocus();'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one Activity focus declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('library/include/borealis/views/tab_frame.hpp')
          s = p.read_text()
          marker = '    void addSeparator();'
          addition = '    // Attach already-created tab content through TabFrame\'s own content container.\n    void setTabContent(View* content);\n\n'
          if 'void setTabContent(View* content);' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected exactly one TabFrame separator declaration, found {s.count(marker)}')
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s)

          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()
          marker = 'void TabFrame::addSeparator()'
          method = '''void TabFrame::setTabContent(View* content)\n{\n    if (!content)\n        return;\n\n    Box* contentView = (Box*)this->contentView;\n    if (!contentView)\n    {\n        delete content;\n        return;\n    }\n\n    if (this->activeTab)\n    {\n        contentView->removeView(this->activeTab);\n        this->activeTab = nullptr;\n    }\n\n    content->setGrow(1.0f);\n    contentView->addView(content);\n    this->activeTab = content;\n}\n\n'''
          if 'void TabFrame::setTabContent(View* content)' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected exactly one TabFrame addSeparator definition, found {s.count(marker)}')
              s = s.replace(marker, method + marker, 1)
              p.write_text(s)
          PY
          git diff --check
      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp
      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
